惧的迷雾"}}),v("m19","太阳","The Sun","major",["喜悦","成功","活力","清晰","成就"],["暂时的阴霾","过度乐观","骄傲"],"阳光灿烂的日子！这是快乐、成功和充满活力的时刻。你正在闪耀，享受这份美好。","暂时的低谷或过度乐观。调整心态，太阳很快就会再次照耀。",{element:"火",symbolism:{太阳:"生命力与启蒙",孩子:"纯真与快乐",向日葵:"向着光明生长"},themeMappings:{career:"大获成功，受到认可和赞赏",love:"感情幸福美满，关系充满活力",wealth:"财运亨通，收获满满",health:"精力充沛，健康状态极佳",general:"光芒万丈的时刻"}}),v("m20","审判","Judgement","major",["重生","觉醒","因果","召唤"],["自我怀疑","拒绝召唤","拖延"],"你被召唤去迎接新生。是时候做出重大决定了——过去的已经过去，新的你在等待诞生。","你在抗拒内心的召唤。拖延不会让召唤消失，只会让过程更痛苦。",{element:"火",symbolism:{号角:"觉醒的召唤",十字架:"救赎与重生",海浪:"新生的能量"},themeMappings:{career:"面临重要的职业抉择或转型",love:"关系的最终审判时刻，真相大白",wealth:"财务上的因果报应，重新评估",health:"身体在呼唤你改变生活方式",general:"重生的时刻到了"}}),v("m21","世界","The World","major",["完成","成就","整合","旅程终点"],["未完成","停滞","缺乏闭环"],"一个周期圆满完成了！你达到了目标，实现了整合。庆祝你的成就，然后为新旅程做准备。","你离完成还差一步。不要放弃，最后的闭环就在眼前。",{element:"土",symbolism:{花环:"圆满与完成",四个符号:"四元素的整合",舞者:"完美的平衡"},themeMappings:{career:"项目成功完成，里程碑达成",love:"关系达到新的成熟阶段",wealth:"财务目标达成，完整的周期",health:"身心灵的整体健康",general:"圆满完成"}})],Pe=["wands","cups","swords","pentacles"],Ie={wands:[{number:1,name:"权杖王牌",kwU:["新开始","灵感","创造力"],kwR:["延迟","缺乏动力"],mU:"新的激情或项目正在点燃。抓住这个创造性的火花！",mR:"创意受阻或机会延迟，耐心等待合适的时机。"},{number:2,name:"权杖二",kwU:["规划","未来","选择"],kwR:["恐惧未知","犹豫不决"],mU:"你站在选择的十字路口。看向远方，大胆规划你的下一步。",mR:"对未知的恐惧让你裹足不前，但原地踏步也是一种选择。"},{number:3,name:"权杖三",kwU:["远见","探索","合作"],kwR:["阻碍","延迟"],mU:"你的视野在扩展。合作和探索会带来新的成长机会。",mR:"计划遇到延迟或合作伙伴不可靠，需要重新评估。"},{number:4,name:"权杖四",kwU:["庆祝","稳定","和谐"],kwR:["不安","缺乏根基"],mU:"你打下了稳固的基础。庆祝这个阶段的成果，享受和谐与安定。",mR:"表面的和谐下有不安，根基还不够稳固，需要继续建设。"},{number:5,name:"权杖五",kwU:["竞争","挑战","冲突"],kwR:["避免冲突","妥协"],mU:"竞争中蕴含着成长的机会。健康的冲突有助于明确你的立场。",mR:"你在回避必要的冲突或竞争，但有些仗必须打。"},{number:6,name:"权杖六",kwU:["胜利","认可","自信"],kwR:["骄傲","失败"],mU:"你获得了应得的认可和胜利。享受这一刻的荣光。",mR:"成功让你自满，或胜利从手中滑落。保持谦逊，重新出发。"},{number:7,name:"权杖七",kwU:["坚持","防御","勇气"],kwR:["不堪重负","放弃"],mU:"面对挑战不要退缩。占据高地，守住你的位置，胜利属于坚持者。",mR:"你感到难以招架，也许需要考虑战略性撤退而非死守。"},{number:8,name:"权杖八",kwU:["速度","行动","进展"],kwR:["延迟","失控"],mU:"事情正在飞速发展！顺势而为，快速行动会带来突破。",mR:"速度太快失控了，或进展突然停滞。需要调整节奏。"},{number:9,name:"权杖九",kwU:["韧性","防守","警觉"],kwR:["疲惫","放弃边缘"],mU:"你已经在风雨中坚持了很久。再坚持一下，终点就在前方。",mR:"你筋疲力尽了。有时放手不是失败，而是明智的止损。"},{number:10,name:"权杖十",kwU:["负担","责任","压力"],kwR:["放下负担","委派"],mU:"你承担了太多。虽然你能够扛住，但试着把一些责任分出去。",mR:"你终于学会了放下或委派任务，肩上的重量在减轻。"},{number:11,court:"侍从",name:"权杖侍从",kwU:["热情","探索","新手"],kwR:["缺乏经验","三分钟热度"],mU:"带着孩子般的好奇和热情去探索新事物。你还不知道自己的潜力。",mR:"热情消退得太快，或缺乏真正的投入。需要想清楚再出发。"},{number:12,court:"骑士",name:"权杖骑士",kwU:["冒险","冲动","行动"],kwR:["鲁莽","半途而废"],mU:"充满冒险精神的你ready去征服世界。行动力十足，但也要看准方向。",mR:"冲动行事导致问题，或事情做了一半就失去兴趣。收敛一下你的火力。"},{number:13,court:"王后",name:"权杖王后",kwU:["自信","温暖","魅力"],kwR:["嫉妒","自我中心"],mU:"你拥有强大的个人魅力和自信。用你的温暖和热情照亮身边的人。",mR:"自信变成了自我中心，或嫉妒蒙蔽了你的眼睛。调整心态。"},{number:14,court:"国王",name:"权杖国王",kwU:["领导力","远见","创业精神"],kwR:["专制","急躁"],mU:"你天生是领导者。用你的远见和魄力带领团队开创新局面。",mR:"你的领导风格过于专断，或急于求成。柔性的力量更持久。"}],cups:[{number:1,name:"圣杯王牌",kwU:["新感情","直觉","爱的开始"],kwR:["情感空虚","压抑"],mU:"新的情感体验正在流入你的生活。打开心扉，让爱进来。",mR:"你关闭了情感的大门，或一段感情未能开始。允许自己感受。"},{number:2,name:"圣杯二",kwU:["联结","吸引力","平等关系"],kwR:["分裂","不对等"],mU:"一段平等而美好的连接正在形成。这是相互吸引和尊重的象征。",mR:"关系失衡或正在疏远。需要重新建立平等的沟通。"},{number:3,name:"圣杯三",kwU:["庆祝","友谊","欢乐"],kwR:["过度放纵","小团体"],mU:"和朋友一起庆祝吧！社交和欢乐的时光会滋养你的心灵。",mR:"注意过度享乐或小团体排外。保持适度和开放。"},{number:4,name:"圣杯四",kwU:["沉思","不满","内省"],kwR:["新机会","觉醒"],mU:"你对现状感到不满，沉浸在自己的思绪中。但机会就在眼前，只是你没看见。",mR:"你终于从沉思中醒来，看到了新的可能性。抓住它。"},{number:5,name:"圣杯五",kwU:["失落","悲伤","遗憾"],kwR:["接受","向前看","原谅"],mU:"你正沉浸在失去的痛苦中。但请转身——背后还有两杯没倒下的。",mR:"你开始接受现实，原谅过去，准备向前走了。"},{number:6,name:"圣杯六",kwU:["回忆","怀旧","馈赠"],kwR:["困在过去","无法成长"],mU:"温暖的回忆和馈赠在围绕你。享受这份温柔，但不要沉溺于过去。",mR:"你过于执着过去，无法活在当下。是时候向前走了。"},{number:7,name:"圣杯七",kwU:["幻想","选择过多","白日梦"],kwR:["聚焦","现实检验"],mU:"太多的可能性让你眼花缭乱。你需要从幻想中回到现实，聚焦一个目标。",mR:"你终于从白日梦中醒来，开始脚踏实地的行动。"},{number:8,name:"圣杯八",kwU:["离开","寻找更多","放弃舒适"],kwR:["停滞","恐惧离开"],mU:"你感到需要离开现有的舒适区去寻找更深的满足。听从这个召唤。",mR:"你害怕离开熟悉的环境，但停滞让你更加空虚。"},{number:9,name:"圣杯九",kwU:["满足","愿望实现","舒适"],kwR:["不满足","虚荣"],mU:"你的愿望正在实现。享受这份满足和成就，你值得拥有。",mR:"表面的满足下隐藏着不真实。你在用物质填补情感的空洞。"},{number:10,name:"
